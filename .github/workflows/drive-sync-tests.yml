name: Drive sync tests

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sync script tests
        run: python scripts/test_sync_from_drive.py
      - name: Confirm missing secrets skip cleanly
        run: python scripts/sync_from_drive.py
